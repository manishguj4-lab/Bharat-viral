<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article | Bharat Viral</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#171717;font-family:Arial,"Noto Sans Devanagari",sans-serif}.top{height:62px;background:#df111b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;font-weight:800}.top a{color:#fff;text-decoration:none}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.article{background:#fff;border-radius:14px;box-shadow:0 3px 18px rgba(0,0,0,.08);overflow:hidden}.hero{width:100%;max-height:470px;object-fit:cover;display:block}.body{padding:30px}.cat{display:inline-block;color:#df111b;font-size:12px;font-weight:900;margin-bottom:10px;text-transform:uppercase}.title{font-size:38px;line-height:1.25;margin:0 0 12px}.meta{color:#777;font-size:13px;margin-bottom:24px}.excerpt{font-size:18px;line-height:1.6;font-weight:700;color:#444;border-left:4px solid #df111b;padding-left:14px;margin-bottom:25px}.content{font-size:18px;line-height:1.85;white-space:pre-wrap}.source{margin-top:28px;padding-top:18px;border-top:1px solid #eee;font-size:13px;color:#666}.source a{color:#df111b}.share{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}.share button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.share .wa{background:#25D366;color:#fff}.share .tg{background:#229ED9;color:#fff}.share .ig{background:#111;color:#fff}.share .copy{background:#eee;color:#222}.views{font-size:13px;color:#777;margin-top:5px}.back{display:inline-block;margin-bottom:18px;color:#df111b;font-weight:800;text-decoration:none}@media(max-width:650px){.top{height:52px;padding:0 15px;font-size:13px}.wrap{margin:15px auto;padding:0 10px}.body{padding:20px}.title{font-size:25px}.excerpt{font-size:15px}.content{font-size:16px;line-height:1.75}.hero{max-height:300px}}
</style>
</head>
<body>
<header class="top"><a href="index.html">← Bharat Viral</a><span>FULL NEWS</span></header>
<div class="wrap">
<a class="back" href="index.html">← वापस Homepage पर</a>
<article class="article" id="articleBox">
<div id="loading" class="body">Article loading…</div>
</article>
</div>
<script>
const SUPABASE_URL="https://ocarsylhsyxjqpzidndb.supabase.co";
const SUPABASE_KEY="sb_publishable_LTmMKlt5saAsFIlnF87_6A_75FFCvK0";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let shareUrl=location.href;
let shareTitle='Bharat Viral';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function time(v){if(!v)return '';const d=new Date(v),m=Math.max(1,Math.floor((Date.now()-d)/60000));if(m<60)return m+' मिनट पहले';const h=Math.floor(m/60);if(h<24)return h+' घंटे पहले';return Math.floor(h/24)+' दिन पहले';}
async function load(){
 const params=new URLSearchParams(location.search);
 const id=params.get('id');
 const title=params.get('title');
 const box=document.getElementById('articleBox');
 let query=db.from('articles').select('*').eq('status','published');
 if(id){
   query=query.eq('id',id).single();
 }else if(title){
   query=query.eq('title',title).order('created_at',{ascending:false}).limit(1);
 }else{
   box.innerHTML='<div class="body"><h2>Article नहीं मिला</h2><p>इस खबर का link सही नहीं है।</p></div>';return;
 }
 const r=await query;
 const a=Array.isArray(r.data)?r.data[0]:r.data;
 if(r.error||!a){box.innerHTML='<div class="body"><h2>Article नहीं मिला</h2><p>यह खबर मौजूद नहीं है या अभी published नहीं है।</p></div>';return;}
 document.title=(a.seo_title||a.title||'Bharat Viral')+' | Bharat Viral';
 const image=a.image_url?'<img class="hero" src="'+esc(a.image_url)+'" alt="'+esc(a.title)+'">':'';
 const category=(Array.isArray(a.categories)&&a.categories[0])?String(a.categories[0]).replace(/-/g,' ').toUpperCase():String(a.article_type||'NEWS').replace(/_/g,' ').toUpperCase();
 const source=a.source_url?'<a href="'+esc(a.source_url)+'" target="_blank" rel="noopener">'+esc(a.source_name||'Source')+'</a>':esc(a.source_name||'');
 shareUrl=location.href;
 shareTitle=a.title||'Bharat Viral';
 box.innerHTML=image+'<div class="body"><div class="cat">'+esc(category)+'</div><h1 class="title">'+esc(a.title)+'</h1><div class="meta">'+(a.author_name?'By '+esc(a.author_name)+' • ':'')+esc(time(a.published_at||a.created_at))+'</div><div class="views">👁 '+Number(a.views||0).toLocaleString('en-IN')+' views</div><div class="share"><button class="wa" onclick="shareWhatsApp()">WhatsApp</button><button class="tg" onclick="shareTelegram()">Telegram</button><button class="ig" onclick="shareInstagram()">Instagram</button><button class="copy" onclick="copyLink()">Copy Link</button></div>'+(a.excerpt?'<div class="excerpt">'+esc(a.excerpt)+'</div>':'')+'<div class="content">'+esc(a.content)+'</div>'+(source?'<div class="source">Source: '+source+'</div>':'')+'</div>';
}
async function addView(id){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/rpc/increment_article_view',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({article_id:id})});
  }catch(e){console.warn('view count update failed',e);}
}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(shareTitle+' '+shareUrl),'_blank','noopener');}
function shareTelegram(){window.open('https://t.me/share/url?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle),'_blank','noopener');}
function shareInstagram(){navigator.clipboard?.writeText(shareUrl).catch(()=>{});alert('News link copy हो गया। अब Instagram पर इसे share कर सकते हैं।');window.open('https://www.instagram.com/','_blank','noopener');}
async function copyLink(){try{await navigator.clipboard.writeText(shareUrl);alert('News link copy हो गया।');}catch(e){alert(shareUrl);}}

load().catch(e=>{document.getElementById('articleBox').innerHTML='<div class="body"><h2>Article load नहीं हो सकी</h2><p>कृपया थोड़ी देर बाद फिर कोशिश करें।</p></div>';console.error(e);});
</script>
</body>
</html>
 addView(a.id);
