.bv-manual-notice-head{display:flex;align-items:center;gap:8px;background:#df0712;color:#fff;padding:10px 14px;font-weight:800;font-size:14px}
.bv-manual-notice-viewport{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.bv-manual-notice-track{display:flex;gap:12px;padding:10px;min-width:max-content}
.bv-manual-notice{display:block;width:320px;flex:0 0 320px;border:1px solid #e6eaf0;border-radius:8px;background:#fff;overflow:hidden;color:#222}
.bv-manual-notice img{display:block;width:100%;height:120px;object-fit:cover}
.bv-manual-notice-body{padding:11px}.bv-manual-notice-title{font-weight:800;font-size:14px;line-height:1.4}.bv-manual-notice-content{margin-top:6px;color:#666;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bv-manual-notice-link{display:inline-block;margin-top:8px;color:#df0712;font-size:11px;font-weight:800}
.bv-home-ad{margin:0 0 22px;background:#fff;border:1px solid #e5e7eb;border-radius:9px;overflow:hidden;min-height:0;text-align:center}
.bv-home-ad-label{font-size:9px;color:#8b95a3;padding:5px 8px;background:#f8fafc;text-transform:uppercase;letter-spacing:.4px}
.bv-home-ad-code{padding:8px;overflow:hidden}.bv-home-ad-code ins{max-width:100%}
@media(max-width:600px){.bv-manual-notice{width:78vw;flex-basis:78vw}.bv-manual-notice img{height:105px}}
</style>

<style id="bv-remove-bottom-trending">#bvFinalTrending,#bvHomeTrending{display:none!important}</style>
<style id="bv-manual-notice-box-css">
#bvManualNoticeSection{
  width:100%;
  margin:22px 0 28px;
}
#bvManualNoticeSection .bv-notice-box{
  width:100%;
  box-sizing:border-box;
  background:#fff;
  border:1px solid #dbe5ef;
  border-radius:14px;
  box-shadow:0 4px 16px rgba(20,55,90,.08);
  overflow:hidden;
}
#bvManualNoticeSection .bv-notice-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  background:#f5f9fd;
  border-bottom:1px solid #dbe5ef;
  color:#123a63;
  font-size:19px;
  font-weight:800;
}
#bvManualNoticeSection .bv-notice-body{
  padding:16px 18px;
  min-height:100px;
}
#bvManualNoticeSection .bv-notice-item{
  padding:12px 0;
  border-bottom:1px solid #edf2f6;
  white-space:normal;
  line-height:1.65;
  color:#25384a;
}
#bvManualNoticeSection .bv-notice-item:last-child{border-bottom:0}
#bvManualNoticeSection .bv-notice-item a{
  color:#075da8;
  text-decoration:none;
  font-weight:700;
}
#bvManualNoticeSection .bv-notice-item a:hover{text-decoration:underline}
#bvManualNoticeSection .bv-notice-empty{
  color:#7a8996;
  text-align:center;
  padding:22px 8px;
}
</style>




<style id="bv-remove-old-trending-final">
#bvFinalTags,#bvHomeTags{display:none!important}
</style>
