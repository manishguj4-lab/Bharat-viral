<main class="wrap"><button class="back" onclick="history.back()">← वापस</button><div class="title"><h2 id="heading">News</h2><p id="sub">इस category की प्रकाशित खबरें</p></div>

<script>
'use strict';

const SUPABASE_URL="https://ocarsylhsyxjqpzidndb.supabase.co";
const SUPABASE_KEY="sb_publishable_LTmMKlt5saAsFIlnF87_6A_75FFCvK0";
const params=new URLSearchParams(location.search);
const PAGE_SIZE=7;
let page=Math.max(1,parseInt(params.get('page')||'1',10)||1);
let catalog=[];
let wanted=(params.get('category')||'news').toLowerCase().trim();

const heading=document.getElementById('heading');
const sub=document.getElementById('sub');
const grid=document.getElementById('grid');
const pagination=document.getElementById('pagination');
const picker=document.getElementById('rashifalPicker');
const canonical=document.getElementById('canonical');
const meta=document.getElementById('metaDescription');

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function loading(t){grid.innerHTML='<div class="loading" role="status">'+esc(t)+'</div>';pagination.innerHTML='';}
function failed(t){grid.innerHTML='<div class="empty" role="alert">'+esc(t)+'</div>';pagination.innerHTML='';}

async function fetchJson(url,options={}){
 const r=await fetch(url,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,...(options.headers||{})}});
 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json();
}

/* Category names, icons and descriptions now come from Supabase. */
async function loadCatalog(){
 const rows=await fetchJson(SUPABASE_URL+'/rest/v1/rpc/get_active_categories',{cache:'default'});
 catalog=Array.isArray(rows)?rows:[];
 if(!catalog.some(c=>c.slug===wanted)) wanted='news';

 const c=catalog.find(x=>x.slug===wanted)||catalog[0];
 if(!c)throw new Error('No active categories configured');

 heading.textContent=(c.icon||'📰')+' '+c.name;
 sub.textContent=c.description||'';
 document.title=c.name+' | Bharat Viral';
 if(meta)meta.content=c.description||c.name;
 if(canonical)canonical.href='https://bharat-viral.netlify.app/category.html?category='+encodeURIComponent(wanted);

 return c;
}

function imageMarkup(a){
 const url=a.image_url||'';
 const title=esc(a.title||'बड़ी खबर');
 if(!url)return '';
 return '<div class="img"><img src="'+esc(url)+'" alt="'+title+
 '" loading="lazy" decoding="async" referrerpolicy="no-referrer" '+
 'onerror="this.onerror=null;this.closest(\'.img\').classList.add(\'img-error\');this.remove();"></div>';
}

function card(a){
 const c=catalog.find(x=>x.slug===a.category_slug);
 const label=esc(c?((c.icon||'')+' '+c.name):a.category_slug||'NEWS');
 const title=esc(a.title||'बड़ी खबर');
 return '<article class="card"><a class="card-link" href="'+(a.slug ? '/article/'+encodeURIComponent(a.slug) : 'article.html?id='+encodeURIComponent(a.id))+
 '" aria-label="'+title+'">'+imageMarkup(a)+
 '<div class="body"><span class="cat">'+label+'</span><h3>'+title+
 '</h3><p>'+esc(a.excerpt||'पूरी खबर पढ़ें')+
 '</p><span class="read">पूरी खबर पढ़ें</span></div></a></article>';
}

async function loadArticles(){
 loading('खबरें लोड हो रही हैं…');
 const rows=await fetchJson(SUPABASE_URL+'/rest/v1/rpc/get_category_articles',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({p_category:wanted,p_limit:PAGE_SIZE,p_offset:(page-1)*PAGE_SIZE}),
  cache:'no-store'
 });
 const list=Array.isArray(rows)?rows:[];
 const total=list.length?Number(list[0].total_count)||list.length:0;
 grid.innerHTML=list.map(card).join('')||
   '<div class="empty">इस category में अभी कोई प्रकाशित खबर उपलब्ध नहीं है।</div>';
 renderPagination(total);
}

function renderPagination(total){
 if(!total||total<=PAGE_SIZE){pagination.innerHTML='';return;}
 const pages=Math.ceil(total/PAGE_SIZE);
 if(page>pages){location.replace('category.html?category='+encodeURIComponent(wanted)+'&page=1');return;}
 let from=Math.max(1,page-2),to=Math.min(pages,from+4);
 if(to-from+1<5)from=Math.max(1,to-4);
 const make=(p,l,c='')=>'<a class="'+c+'" href="category.html?category='+encodeURIComponent(wanted)+'&page='+p+'">'+l+'</a>';
 let h=page>1?make(page-1,'‹ पिछला','next'):'';
 if(from>1)h+=make(1,'1');
 if(from>2)h+='<span aria-hidden="true">…</span>';
 for(let p=from;p<=to;p++)h+=p===page?'<span class="active" aria-current="page">'+p+'</span>':make(p,p);
 if(to<pages-1)h+='<span aria-hidden="true">…</span>';
 if(to<pages)h+=make(pages,pages);
 if(page<pages)h+=make(page+1,'अगला ›','next');
 h+='<div class="page-note" style="flex-basis:100%">पेज '+page+' / '+pages+'</div>';
 pagination.innerHTML=h;
}

/* Rashifal is also served through a Supabase RPC. */
let rashifalController=null;
function populateDays(){
 const d=document.getElementById('rDay'),m=document.getElementById('rMonth'),y=document.getElementById('rYear');
 const old=Number(d.value)||new Date().getDate();
 const max=new Date(Number(y.value),Number(m.value),0).getDate();
 let html='';
 for(let i=1;i<=max;i++)html+='<option value="'+String(i).padStart(2,'0')+'">'+i+'</option>';
 d.innerHTML=html;
 d.value=String(Math.min(old,max)).padStart(2,'0');
}
function setupRashifal(){
 picker.style.display='block';
 const now=new Date(),d=document.getElementById('rDay'),m=document.getElementById('rMonth'),y=document.getElementById('rYear');
 for(let i=1;i<=12;i++)m.insertAdjacentHTML('beforeend','<option value="'+String(i).padStart(2,'0')+'">'+i+'</option>');
 for(let i=now.getFullYear();i>=now.getFullYear()-10;i--)y.insertAdjacentHTML('beforeend','<option value="'+i+'">'+i+'</option>');
 m.value=String(now.getMonth()+1).padStart(2,'0');y.value=String(now.getFullYear());
 populateDays();d.value=String(now.getDate()).padStart(2,'0');
 m.addEventListener('change',populateDays);y.addEventListener('change',populateDays);
 document.getElementById('rGo').addEventListener('click',loadRashifal);
}
function safeRichText(v){
 let raw=String(v??'').trim().replace(/^```(?:html|HTML)?\s*/,'').replace(/\s*```$/,'').trim();
 if(/&lt;\/?(?:h[3-5]|p|strong|b|em|i|ul|ol|li|br|blockquote)\b/i.test(raw)){
  const d=document.createElement('textarea');d.innerHTML=raw;raw=d.value;
 }
 raw=raw.replace(/<!doctype[^>]*>/ig,'').replace(/<\/?(?:html|head|body)[^>]*>/ig,'');
 const tpl=document.createElement('template');tpl.innerHTML=raw;
 const allowed=new Set(['H3','H4','H5','P','BR','STRONG','B','EM','I','UL','OL','LI','BLOCKQUOTE']);
 const walk=n=>[...n.children].forEach(el=>{
  if(!allowed.has(el.tagName)){const f=document.createDocumentFragment();while(el.firstChild)f.appendChild(el.firstChild);el.replaceWith(f);return;}
  [...el.attributes].forEach(a=>el.removeAttribute(a.name));walk(el);
 });
 walk(tpl.content);return tpl.innerHTML;
}
async function loadRashifal(){
 if(rashifalController)rashifalController.abort();
 rashifalController=new AbortController();
 const y=Number(document.getElementById('rYear').value),m=Number(document.getElementById('rMonth').value),d=Number(document.getElementById('rDay').value);
 const date=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
 loading('राशिफल लोड हो रहा है…');
 try{
  const rows=await fetchJson(SUPABASE_URL+'/rest/v1/rpc/get_daily_rashifal',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({p_date:date}),
   cache:'default',
   signal:rashifalController.signal
  });
  grid.innerHTML=(Array.isArray(rows)?rows:[]).map(a=>
   '<article class="card"><div class="body"><span class="cat">🌙 राशिफल</span><h3>'+
   esc(a.title||a.rashi||'राशिफल')+'</h3><div class="rashifal-content">'+safeRichText(a.content)+'</div>'+
   (a.source_name?'<p style="font-size:11px;color:#777;min-height:0">स्रोत: '+esc(a.source_name)+'</p>':'')+
   '</div></article>'
  ).join('')||'<div class="empty">इस तारीख का राशिफल उपलब्ध नहीं है।</div>';
  pagination.innerHTML='';
 }catch(e){if(e.name!=='AbortError'){console.error(e);failed('राशिफल लोड नहीं हो पाया। कृपया थोड़ी देर बाद फिर प्रयास करें।');}}
}

async function init(){
 loading('लोड हो रहा है…');
 try{
  const c=await loadCatalog();
  if(c.slug==='rashifal'){setupRashifal();await loadRashifal();}
  else await loadArticles();
 }catch(e){console.error(e);failed('डेटा लोड नहीं हो पाया। कृपया थोड़ी देर बाद फिर प्रयास करें।');}
}
init();
</script></body></html>
