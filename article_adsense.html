function slugify(value){
 return String(value||"").toLowerCase().trim().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
}
let shareUrl=location.href,shareTitle='Bharat Viral';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function decodeHTMLText(raw){
 const t=document.createElement('textarea');
 t.innerHTML=String(raw??'');
 return t.value;
}

function sanitizeArticleHTML(raw){
 let source=String(raw??'');
 // Supabase content may contain HTML entities such as &lt;p&gt;.
 // Decode them once before parsing so tags are not printed as text.
 source=decodeHTMLText(source);
 let doc;
 try{
   doc=new DOMParser().parseFromString(source,"text/html");
 }catch(e){
   return esc(source);
 }
 doc.querySelectorAll("script,style,iframe,object,embed,form,link,meta").forEach(el=>el.remove());
 doc.querySelectorAll("*").forEach(el=>{
   [...el.attributes].forEach(attr=>{
     const name=attr.name.toLowerCase();
     const value=attr.value||"";
     if(name.startsWith("on") || name==="srcdoc"){
       el.removeAttribute(attr.name);
       return;
     }
     if((name==="href" || name==="src") && /^\s*javascript:/i.test(value)){
       el.removeAttribute(attr.name);
     }
   });
   if(el.tagName==="A"){
     el.setAttribute("target","_blank");
     el.setAttribute("rel","noopener noreferrer");
   }
 });
 return doc.body.innerHTML;
}

function formatArticleText(text){
 let value=String(text??"").trim();

 // Also handle content that was saved HTML-escaped.
 const decodedValue=decodeHTMLText(value).trim();
 if(/<\s*(p|div|h[1-6]|strong|b|em|i|u|ul|ol|li|a|br|blockquote|table|img)\b/i.test(decodedValue)){
   return sanitizeArticleHTML(decodedValue);
 }

 // Articles created by the Admin Editor may already contain HTML
 // (<p>, <h3>, <strong>, <a>, etc.). Render that HTML instead of
 // escaping it into visible code.
 if(/<\s*(p|div|h[1-6]|strong|b|em|i|u|ul|ol|li|a|br|blockquote|table|img)\b/i.test(value)){
   return sanitizeArticleHTML(value);
 }

 let html=esc(value);
 const links=[];

 function tokenFor(index){
  let n=index,s='';
  do{
   s=String.fromCharCode(65+(n%26))+s;
   n=Math.floor(n/26)-1;
  }while(n>=0);
  return '___URLTOKEN'+s+'___';
 }

 html=html.replace(/https?:\/\/[^\s<>"']+/gi,function(url){
  const token=tokenFor(links.length);
  links.push('<a class="content-link" href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>');
  return token;
 });

 html=html.replace(/([^.!?\n]{2,}\?)/g,'<span class="question-highlight">$1</span>');
 html=html.replace(/(\d+)/g,'<span class="digit-highlight">$1</span>');

 links.forEach(function(link,i){
  html=html.replace(tokenFor(i),link);
 });

 return html.replace(/\n/g,'<br>');
}

async function downloadPdfFile(url, filename){
 try{
  const response=await fetch(url,{mode:"cors"});
  if(!response.ok) throw new Error("HTTP "+response.status);
  const blob=await response.blob();
  const blobUrl=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=blobUrl;
  a.download=filename||"document.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl),1000);
 }catch(error){
  console.error("PDF download failed:",error);
  window.open(url,"_blank","noopener,noreferrer");
 }
}


document.addEventListener("click",function(event){
 const button=event.target.closest(".pdf-download-btn");
 if(!button) return;
 event.preventDefault();
 downloadPdfFile(button.dataset.pdfUrl,button.dataset.pdfName||"document.pdf");
});


function renderArticleContent(raw){
 const value=String(raw??'');
 const tokenRe=/\[\[(IMAGE|PDF)\|([^|\]]+)\|([^\]]*)\]\]/g;
 let html='',last=0,match;

 while((match=tokenRe.exec(value))!==null){
  html+=formatArticleText(value.slice(last,match.index));

  let url='',label='';
  try{url=decodeURIComponent(match[2]);}catch(e){url=match[2];}
  try{label=decodeURIComponent(match[3]||'');}catch(e){label=match[3]||'';}

  if(/^https?:\/\//i.test(url)){
   if(match[1]==='IMAGE'){
    html+='<img class="inline-article-image" src="'+esc(url)+'" alt="'+esc(label||'Article image')+'" loading="lazy" decoding="async">';
   }else{
    html+='<div class="inline-article-pdf"><div class="inline-article-pdf-title">📄 '+esc(label||'PDF Document')+'</div><div class="inline-article-pdf-actions"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">📖 PDF देखें</a><button type="button" class="secondary pdf-download-btn" data-pdf-url="'+esc(url)+'" data-pdf-name="'+esc((label||'PDF Document').replace(/\.pdf$/i,'')+'.pdf')+'">⬇️ Download PDF</button></div></div>';
   }
  }

  last=tokenRe.lastIndex;
 }

 html+=formatArticleText(value.slice(last));
 return html;
}

function time(v){if(!v)return '';const d=new Date(v),m=Math.max(1,Math.floor((Date.now()-d)/60000));if(m<60)return m+' मिनट पहले';const h=Math.floor(m/60);if(h<24)return h+' घंटे पहले';return Math.floor(h/24)+' दिन पहले';}
function setupSEO(a){
 const title=a.seo_title||a.seoTitle||a.title||'Bharat Viral';
 const description=a.seo_description||a.seoDescription||a.meta_description||a.metaDescription||a.excerpt||a.title||'Bharat Viral पर ताजा खबरें और वायरल समाचार पढ़ें।';
 const slug=String(a.slug||slugify(a.title)||'').trim();
 const url=slug ? new URL('article.html?slug='+encodeURIComponent(slug),location.origin).href : location.href;
 const image=a.image_url||'https://bharat-viral.netlify.app/';
 const published=a.published_at||a.created_at||new Date().toISOString();
 const modified=a.updated_at||a.updatedAt||a.published_at||a.created_at||published;
 const mainKeyword=a.main_keyword||a.mainKeyword||a.focus_keyword||a.focusKeyword||a.focus_keyphrase||a.focusKeyphrase||'';

 const relatedRaw=a.related_keywords||a.relatedKeywords||a.related_keywords_text||a.relatedKeywordsText||[];
 const relatedKeywords=Array.isArray(relatedRaw)
   ? relatedRaw.filter(Boolean).map(x=>String(x).trim()).filter(Boolean)
   : String(relatedRaw||'').split(/[,|\n]+/).map(x=>x.trim()).filter(Boolean);

 const tagsRaw=a.tags||a.tag||a.article_tags||a.articleTags||[];
 const tags=Array.isArray(tagsRaw)
   ? tagsRaw.filter(Boolean).map(x=>String(x).trim()).filter(Boolean)
   : String(tagsRaw||'').split(/[,|\n]+/).map(x=>x.trim()).filter(Boolean);

 document.title=title+' | Bharat Viral';
 document.querySelector('meta[name="robots"]')?.setAttribute(
   'content',
   String(a.status||'').toLowerCase()==='published'
     ? 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1'
     : 'noindex, follow'
 );
 document.getElementById('metaDescription')?.setAttribute('content',String(description).substring(0,160));
 document.getElementById('canonicalUrl')?.setAttribute('href',url);
 document.getElementById('ogTitle')?.setAttribute('content',title);
 document.getElementById('ogDescription')?.setAttribute('content',description);
 document.getElementById('ogUrl')?.setAttribute('content',url);
 document.getElementById('ogImage')?.setAttribute('content',image);

 document.querySelector('meta[name="keywords"]')?.remove();
 const keywords=[mainKeyword,...relatedKeywords].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i);
 if(keywords.length){
   const meta=document.createElement('meta');
   meta.name='keywords';
   meta.content=keywords.join(', ');
   document.head.appendChild(meta);
 }

 document.getElementById('articleSchema')?.remove();
 const script=document.createElement('script');
 script.type='application/ld+json';
 script.id='articleSchema';
 script.textContent=JSON.stringify({
   "@context":"https://schema.org",
   "@type":"NewsArticle",
   "mainEntityOfPage":{"@type":"WebPage","@id":url},

   "description":description,
   "image":[image],
   "datePublished":published,
   "dateModified":modified,
   "keywords":[...tags,...keywords].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i),
   "articleSection":Array.isArray(a.categories)?a.categories:[],
   "author":{"@type":"Person","name":a.author_name||"Bharat Viral"},
   "publisher":{"@type":"Organization","name":"Bharat Viral","url":"https://bharat-viral.netlify.app/"},
   "url":url
 }).replace(/</g,'\u003c');
 document.head.appendChild(script);
}

async function loadRelatedNews(currentArticle){
  try{
    const categories = Array.isArray(currentArticle.categories) ? currentArticle.categories.filter(Boolean) : [];
    let related = [];

    if(categories.length){
      const q = await db.from('articles')
        .select('id,title,image_url,published_at,created_at,article_type,categories,slug')
        .eq('status','published')
        .overlaps('categories', categories)
        .neq('id', currentArticle.id)
        .order('published_at',{ascending:false})
        .limit(6);
      if(!q.error) related = q.data || [];
    }

    if(!related.length && currentArticle.article_type){
      const q = await db.from('articles')
        .select('id,title,image_url,published_at,created_at,article_type,categories,slug')
        .eq('status','published')
        .eq('article_type', currentArticle.article_type)
        .neq('id', currentArticle.id)
        .order('published_at',{ascending:false})
        .limit(6);
      if(!q.error) related = q.data || [];
    }

    if(!related.length){
      const q = await db.from('articles')
        .select('id,title,image_url,published_at,created_at,article_type,categories,slug')
        .eq('status','published')
        .neq('id', currentArticle.id)
        .order('published_at',{ascending:false})
        .limit(6);
      if(!q.error) related = q.data || [];
    }

    related = related.filter(x => x && x.id && x.title).slice(0,6);
    if(!related.length) return '';

    const cards = related.map(x => {
      const href=x.slug ? ('article.html?slug='+encodeURIComponent(x.slug)) : ('article.html?id='+encodeURIComponent(x.id));
      const img=x.image_url
        ? '<img src="'+esc(x.image_url)+'" alt="'+esc(x.title)+'" loading="lazy" decoding="async">'
        : '';
      const cat=Array.isArray(x.categories)&&x.categories[0]
        ? String(x.categories[0]).replace(/-/g,' ')
        : String(x.article_type||'NEWS').replace(/_/g,' ');
      return '<a class="related-card" href="'+href+'">'+img+
        '<div class="related-card-body"><div class="related-card-title">'+esc(x.title)+'</div>'+
        '<div class="related-card-meta">'+esc(cat)+' • '+esc(time(x.published_at||x.created_at))+'</div></div></a>';
    }).join('');

    return '<section class="related-news"><h2>Related News</h2><div class="related-grid">'+cards+'</div></section>';
  }catch(e){
    console.warn('Related News load failed',e);
    return '';
  }
}

async function load(){
const params=new URLSearchParams(location.search),id=params.get('id'),slug=params.get('slug'),title=params.get('title'),box=document.getElementById('articleBox');
let query=db.from('articles').select('*').eq('status','published');
if(slug)query=query.eq('slug',slug).single();else if(id)query=query.eq('id',id).single();else if(title)query=query.eq('title',title).order('created_at',{ascending:false}).limit(1);else{box.innerHTML='<div class="body"><h2>Article नहीं मिला</h2><p>इस खबर का link सही नहीं है।</p></div>';return;}
const r=await query,a=Array.isArray(r.data)?r.data[0]:r.data;
if(r.error||!a){box.innerHTML='<div class="body"><h2>Article नहीं मिला</h2><p>यह खबर मौजूद नहीं है या अभी published नहीं है।</p></div>';return;}
setupSEO(a);
const image=a.image_url?'<img class="hero" src="'+esc(a.image_url)+'" alt="'+esc(a.title)+'" loading="eager">':'';
const category=(Array.isArray(a.categories)&&a.categories[0])?String(a.categories[0]).replace(/-/g,' ').toUpperCase():String(a.article_type||'NEWS').replace(/_/g,' ').toUpperCase();
const source=a.source_url?'<a href="'+esc(a.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.source_name||'Source')+'</a>':esc(a.source_name||'');
shareUrl=location.href;shareTitle=a.title||'Bharat Viral';
const relatedHtml=await loadRelatedNews(a);
box.innerHTML=image+'<div class="body"><div class="cat">'+esc(category)+'</div><h1 class="title">'+esc(a.title)+'</h1><div class="meta">'+(a.author_name?'By '+esc(a.author_name)+' • ':'')+esc(time(a.published_at||a.created_at))+'</div><div class="views">👁 '+Number(a.views||0).toLocaleString('en-IN')+' views</div><div class="share"><button class="wa" onclick="shareWhatsApp()">WhatsApp</button><button class="tg" onclick="shareTelegram()">Telegram</button><button class="ig" onclick="shareInstagram()">Instagram</button><button class="copy" onclick="copyLink()">Copy Link</button></div>'+(a.excerpt?'<div class="excerpt">'+esc(a.excerpt)+'</div>':'')+'<div class="bv-manual-ad-slot" data-ad-slot="article_middle" style="display:none;width:100%;max-width:100%;margin:18px auto;text-align:center;overflow:hidden;"></div><div class="content">'+renderArticleContent(a.content)+'</div>'+(source?'<div class="source">Source: '+source+'</div>':'')+relatedHtml+'</div>';
addView(a.id);
}
async function addView(id){if(!id)return;try{await fetch(SUPABASE_URL+'/rest/v1/rpc/increment_article_view',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({article_id:id})});}catch(e){console.warn('view count update failed',e);}}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(shareTitle+' '+shareUrl),'_blank','noopener');}
function shareTelegram(){window.open('https://t.me/share/url?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle),'_blank','noopener');}
function shareInstagram(){navigator.clipboard?.writeText(shareUrl).catch(()=>{});alert('News link copy हो गया। अब Instagram पर इसे share कर सकते हैं।');window.open('https://www.instagram.com/','_blank','noopener');}
async function copyLink(){try{await navigator.clipboard.writeText(shareUrl);alert('News link copy हो गया।');}catch(e){alert(shareUrl);}}
load().catch(e=>{document.getElementById('articleBox').innerHTML='<div class="body"><h2>Article load नहीं हो सकी</h2><p>कृपया थोड़ी देर बाद फिर कोशिश करें।</p></div>';console.error(e);});
</script>

    .eq("enabled",true)
    .order("display_order",{ascending:true});
  if(result.error){console.warn("Manual ads:",result.error.message);return;}

  document.querySelectorAll(".bv-manual-ad-slot").forEach(el=>{
    el.innerHTML="";
    el.style.display="none";
  });

  (result.data||[]).forEach(ad=>{
    const placement=String(ad.placement||ad.slot_name||"").trim().toLowerCase();
    if(!placement || !ad.ad_code) return;

    document.querySelectorAll('.bv-manual-ad-slot[data-ad-slot="'+CSS.escape(placement)+'"]')
      .forEach(el=>{
        el.innerHTML=ad.ad_code;
        el.style.display="block";

        // Re-run AdSense units inserted as innerHTML.
        if(window.adsbygoogle){
          el.querySelectorAll(".adsbygoogle").forEach(()=>{
            try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
          });
        }
      });
  });
}

function start(){
  renderManualAds();
  setInterval(renderManualAds,60000);
}
if(document.readyState==="loading")
  document.addEventListener("DOMContentLoaded",start,{once:true});
else start();
})();
</script>


<script id="bv-all-settings-live-public">
(function(){
"use strict";
const client=()=>window.supabaseClient||window.sb||null;
let lastJSON="";

async function getSettings(){
 const sb=client(); if(!sb)return {};
 const r=await sb.from("site_settings").select("key,value");
 if(r.error){console.warn("site_settings:",r.error.message);return {};}
 const s={};(r.data||[]).forEach(x=>s[x.key]=x.value??""); return s;
}
function bool(v,def=false){if(v===undefined||v===null||v==="")return def;return String(v)==="true";}
function text(selector,value){
 if(value===undefined)return;
 document.querySelectorAll(selector).forEach(e=>e.textContent=String(value));
}
function apply(s){
 const root=document.documentElement;

 // Identity / SEO
 if(s.siteName){document.title=s.siteName;text("[data-site-name],.site-name,.brand-name",s.siteName);}
 if(s.seoTitle)document.title=s.seoTitle;
 const desc=s.seoDescription||s.siteDescription;
 if(desc)document.querySelectorAll('meta[name="description"]').forEach(e=>e.content=desc);
 if(s.canonical)document.querySelectorAll('link[rel="canonical"]').forEach(e=>e.href=s.canonical);
 if(s.robots)document.querySelectorAll('meta[name="robots"]').forEach(e=>e.content=s.robots);

 // Theme
 if(s.primaryColor){root.style.setProperty("--primary",s.primaryColor);root.style.setProperty("--primary-color",s.primaryColor);}
 if(s.accentColor){root.style.setProperty("--accent",s.accentColor);root.style.setProperty("--accent-color",s.accentColor);}

 // Logo / favicon
 const logo=s.webLogoUrl||s.logoUrl;
 if(logo)document.querySelectorAll('img[data-site-logo],.site-logo img,.logo img,.brand img').forEach(e=>e.src=logo);
 const fav=s.webFaviconUrl||s.faviconUrl;
 if(fav)document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]').forEach(e=>e.href=fav);

 // Footer / contact / social
 if(s.footerText)text("[data-footer-text],footer .footer-text",s.footerText);
 if(s.webContactEmail||s.contactEmail){
   const email=s.webContactEmail||s.contactEmail;
   document.querySelectorAll("[data-contact-email],footer a[href^='mailto:']").forEach(e=>{e.textContent=email;e.href="mailto:"+email;});
 }
 const socials={telegram:s.telegram,facebook:s.facebook,instagram:s.instagram,youtube:s.youtube,twitter:s.twitter};
 Object.entries(socials).forEach(([k,v])=>{
   if(v)document.querySelectorAll('[data-social="'+k+'"],a[data-'+k+']').forEach(e=>e.href=v);
 });

 // Breaking / trending / notice visibility
 if(s.breakingEnabled!==undefined){
   const show=bool(s.breakingEnabled,true);
   document.querySelectorAll("#bvBreakingNews,.breaking-news,.breaking-bar").forEach(e=>e.style.display=show?"":"none");
 }
 if(s.trendingEnabled!==undefined){
   const show=bool(s.trendingEnabled,true);
   document.querySelectorAll("#bvFinalTags,#bvHomeTags,.trending-section,.trending-container").forEach(e=>e.style.display=show?"":"none");
 }
 if(s.noticeEnabled!==undefined){
   const show=bool(s.noticeEnabled,true);
   document.querySelectorAll("#bvManualNoticeSection,.manual-notices,.manual-notice-list").forEach(e=>e.style.display=show?"":"none");
 }
 if(s.viewAll!==undefined && !bool(s.viewAll,true)){
   document.querySelectorAll(".section-more,.view-all,.viewAll").forEach(e=>e.style.display="none");
 }

 // Ads master switches
 if(s.adsEnabled!==undefined && !bool(s.adsEnabled,true)){
   document.querySelectorAll(".bv-manual-ad-slot,.bv-adsense-auto-slot,[data-adsense-placement]").forEach(e=>e.style.display="none");
 }

 // Maintenance mode
 if(bool(s.maintenance,false)){
   if(!document.getElementById("bvMaintenanceOverlay")){
     const d=document.createElement("div");d.id="bvMaintenanceOverlay";
     d.style.cssText="position:fixed;inset:0;background:#fff;z-index:2147483647;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:700 20px system-ui;color:#123a63";
     d.innerHTML="<div><div style='font-size:50px'>🛠️</div><h2>Website Maintenance</h2><p>Website अभी maintenance में है। कृपया थोड़ी देर बाद फिर आएँ।</p></div>";
     document.body.appendChild(d);
   }
 }else document.getElementById("bvMaintenanceOverlay")?.remove();

 // Analytics (only add once when a GA ID is configured)
 if(s.gaId && !document.getElementById("bv-ga-live")){
   const sc=document.createElement("script");sc.id="bv-ga-live";sc.async=true;sc.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(s.gaId);document.head.appendChild(sc);
   const inline=document.createElement("script");inline.textContent="window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config',"+JSON.stringify(s.gaId)+");";document.head.appendChild(inline);
 }

 lastJSON=JSON.stringify(s);
}
async function refresh(){
 const s=await getSettings(); if(JSON.stringify(s)!==lastJSON)apply(s);
}
function start(){refresh();setInterval(refresh,15000);}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
})();
</script>
