[functions]
  directory = "netlify/functions"

[build]
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  function = "article-seo"
  path = "/article/*"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/news-sitemap.xml"
  to = "/.netlify/functions/news-sitemap"
  status = 200
  force = true
