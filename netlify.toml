[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_KEY,SUPABASE_URL"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "sb_publishable_LTmMKlt5saAsFIlnF87_6A_75FFCvK0,https://ocarsylhsyxjqpzidndb.supabase.co"

[[edge_functions]]
  path = "/article/*"
  function = "article-ssr"

[[edge_functions]]
  path = "/article.html"
  function = "article-ssr"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/news-sitemap.xml"
  to = "/.netlify/functions/news-sitemap"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
