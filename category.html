<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bharat Viral - Category</title>
<!-- Category system fixed: uses saved categories field, not keyword guessing. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:Arial,sans-serif}.top{background:#df0712;color:#fff;padding:9px 15px;font-size:12px;font-weight:700}.head{background:#fff;border-bottom:1px solid #ddd}.headin{max-width:1100px;margin:auto;min-height:105px;display:flex;align-items:center;justify-content:space-between;padding:15px}.brand h1{margin:0;color:#df0712;font-size:28px}.brand p{margin:5px 0 0;font-size:12px}.home{border:0;background:#df0712;color:#fff;border-radius:7px;padding:11px 17px;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:20px auto;padding:0 15px}.title{background:#fff;border-left:5px solid #df0712;border-radius:8px;padding:17px 18px;margin-bottom:15px}.title h2{margin:0 0 5px}.title p{margin:0;color:#666;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}.img{height:190px;background:#e9eef2}.img img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:15px}.cat{font-size:10px;color:#df0712;font-weight:800}.body h3{margin:8px 0;font-size:18px;line-height:1.35}.body p{color:#666;font-size:12px;line-height:1.55;min-height:38px}.read{background:#df0712;color:#fff;border:0;border-radius:5px;padding:9px 13px;font-weight:700;cursor:pointer}.empty{background:#fff;padding:35px;text-align:center;border-radius:10px;color:#777}.back{margin-bottom:15px;background:#fff;border:1px solid #ddd;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.img{height:210px}.brand h1{font-size:22px}}
</style>
</head>
<body>
<div class="top">🔥 BHARAT VIRAL • वायरल खबरों की सच्ची जानकारी</div>
<header class="head"><div class="headin"><div class="brand"><h1>BHARAT VIRAL</h1><p>जो वायरल है, उसकी सच्ची जानकारी</p></div><button class="home" onclick="location.href='index.html'">🏠 HOME</button></div></header>
<main class="wrap"><button class="back" onclick="history.back()">← वापस</button><div class="title"><h2 id="heading">News</h2><p id="sub">इस category की प्रकाशित खबरें</p></div><div id="grid" class="grid"></div></main>
<script>
const URL="https://ocarsylhsyxjqpzidndb.supabase.co";
const KEY="sb_publishable_LTmMKlt5saAsFIlnF87_6A_75FFCvK0";
const params=new URLSearchParams(location.search);const wanted=(params.get('category')||'news').toLowerCase();
const names={'trending':'🔥 Trending News','news':'📰 Latest News','fact-check':'🛡️ Fact Check','explained':'💡 Explained','entertainment':'🎬 Entertainment','sports':'⚽ Sports','tech-education':'💻 Tech & Education','social':'📱 Social Media'};
document.getElementById('heading').textContent=names[wanted]||'📰 News';
function strip(v){const d=document.createElement('div');d.innerHTML=String(v||'');return d.textContent||''}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(v){
  return String(v||'')
    .toLowerCase()
    .trim()
    .replace(/[\s_-]+/g,'-')
    .replace(/[^a-z0-9\-]/g,'');
}
function categoryValues(a){
  let values=[];
  if(Array.isArray(a.categories)) values=values.concat(a.categories);
  if(typeof a.categories==='string'){
    try{
      const parsed=JSON.parse(a.categories);
      values=values.concat(Array.isArray(parsed)?parsed:[a.categories]);
    }catch(e){
      values=values.concat(a.categories.split(','));
    }
  }
  // Legacy fields are only a fallback, not keyword-based classification.
  if(a.category) values.push(a.category);
  if(a.article_type) values.push(a.article_type);
  return [...new Set(values.map(norm).filter(Boolean))];
}
function matchCategory(a,wantedCategory){
  const values=categoryValues(a);
  const wantedNorm=norm(wantedCategory);
  const aliases={
    'tech-education':['tech-education','technology-education','technology','tech','education'],
    'fact-check':['fact-check','factcheck'],
    'social':['social','social-media'],
    'news':['news','latest-news'],
    'trending':['trending']
  };
  const accepted=aliases[wantedNorm]||[wantedNorm];
  return values.some(v=>accepted.includes(v));
}
function articleCard(a){const id=encodeURIComponent(a.id||'');const title=esc(a.title||'बड़ी खबर');const ex=esc(a.excerpt||a.summary||strip(a.content).slice(0,150)||'पूरी खबर पढ़ें');const img=a.image_url?'<img src="'+esc(a.image_url)+'" alt="'+title+'">':'<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:55px">📰</div>';return '<article class="card" onclick="location.href=\'article.html?id='+id+'\'"><div class="img">'+img+'</div><div class="body"><span class="cat">'+esc(a.category||a.article_type||'NEWS')+'</span><h3>'+title+'</h3><p>'+ex+'</p><button class="read" onclick="event.stopPropagation();location.href=\'article.html?id='+id+'\'">पूरी खबर पढ़ें</button></div></article>'}
async function load(){
  try{
    const r=await fetch(
      URL+'/rest/v1/articles?select=*&status=eq.published&order=created_at.desc&limit=1000',
      {headers:{apikey:KEY,Authorization:'Bearer '+KEY}}
    );
    if(!r.ok)throw Error(r.status);

    const all=await r.json();

    // IMPORTANT:
    // Category is taken from the article's saved `categories` value.
    // We do NOT inspect title/content/keywords, so an Entertainment article
    // cannot accidentally move into Tech & Education.
    const items=all.filter(a=>matchCategory(a,wanted));

    document.getElementById('grid').innerHTML=
      items.map(articleCard).join('')||
      '<div class="empty">इस category में अभी कोई प्रकाशित खबर उपलब्ध नहीं है।</div>';
  }catch(e){
    document.getElementById('grid').innerHTML=
      '<div class="empty">खबरें लोड नहीं हो पाईं। कृपया थोड़ी देर बाद फिर प्रयास करें।</div>';
    console.error(e);
  }
}
load();
</script></body></html>
