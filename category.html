<body>
<div class="top">🔥 BHARAT VIRAL • वायरल खबरों की सच्ची जानकारी</div>
<header class="head"><div class="headin"><div class="brand"><h1>BHARAT VIRAL</h1><p>जो वायरल है, उसकी सच्ची जानकारी</p></div><button class="home" onclick="location.href='index.html'">🏠 HOME</button></div></header>
<main class="wrap"><button class="back" onclick="history.back()">← वापस</button><div class="title"><h2 id="heading">News</h2><p id="sub">इस category की प्रकाशित खबरें</p></div>
<div id="rashifalPicker" style="display:none;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:15px">
<label style="font-weight:700;font-size:13px">राशिफल की तारीख चुनें</label>
<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
<select id="rDay" style="padding:9px;border:1px solid #ccc;border-radius:6px"></select>
<select id="rMonth" style="padding:9px;border:1px solid #ccc;border-radius:6px"></select>
<select id="rYear" style="padding:9px;border:1px solid #ccc;border-radius:6px"></select>
<select id="rashiSelect" style="padding:9px;border:1px solid #ccc;border-radius:6px">
<option value="all">सभी राशियाँ</option>
<option>मेष</option><option>वृषभ</option><option>मिथुन</option><option>कर्क</option><option>सिंह</option><option>कन्या</option>
<option>तुला</option><option>वृश्चिक</option><option>धनु</option><option>मकर</option><option>कुंभ</option><option>मीन</option>
</select>
<button id="rGo" class="read" type="button">देखें</button>
</div></div>
<div id="grid" class="grid"></div><div id="pagination" class="pagination" aria-label="Pagination"></div></main>
<script>
const URL="https://ocarsylhsyxjqpzidndb.supabase.co";
const KEY="sb_publishable_LTmMKlt5saAsFIlnF87_6A_75FFCvK0";
const params=new URLSearchParams(location.search);
const canonicalUrl=document.getElementById('canonical');
const allowedCategories=['trending','news','fact-check','explained','entertainment','sports','tech-education','social','rashifal'];
const requestedCategory=(params.get('category')||'news').toLowerCase();
const safeCategory=allowedCategories.includes(requestedCategory)?requestedCategory:'news';
if(canonicalUrl){
  canonicalUrl.href='https://bharat-viral.netlify.app/category.html?category='+encodeURIComponent(safeCategory);
}
const wanted=safeCategory;
const isRashifal=wanted==='rashifal';
if(isRashifal){
  document.getElementById('rashifalPicker').style.display='block';
  document.getElementById('sub').textContent='12 राशियों का दैनिक राशिफल';
  const now=new Date();
  const dayEl=document.getElementById('rDay'), monthEl=document.getElementById('rMonth'), yearEl=document.getElementById('rYear');
  for(let d=1;d<=31;d++)dayEl.insertAdjacentHTML('beforeend',`<option value="${String(d).padStart(2,'0')}">${d}</option>`);
  for(let m=1;m<=12;m++)monthEl.insertAdjacentHTML('beforeend',`<option value="${String(m).padStart(2,'0')}">${m}</option>`);
  const thisYear=now.getFullYear();
  for(let y=thisYear;y>=thisYear-10;y--)yearEl.insertAdjacentHTML('beforeend',`<option value="${y}">${y}</option>`);
  dayEl.value=String(now.getDate()).padStart(2,'0');
  monthEl.value=String(now.getMonth()+1).padStart(2,'0');
  yearEl.value=String(thisYear);
  document.getElementById('rGo').onclick=()=>loadRashifal();
}
async function loadRashifal(){
  const grid=document.getElementById('grid');
  const date=`${document.getElementById('rYear').value}-${document.getElementById('rMonth').value}-${document.getElementById('rDay').value}`;
  try{
    const r=await fetch(URL+'/rest/v1/daily_rashifal?select=*&rashifal_date=eq.'+encodeURIComponent(date)+'&order=id.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});
    if(!r.ok)throw Error(r.status);
    const rows=await r.json();
    const order=['मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन'];
    const selectedRashi=document.getElementById('rashiSelect').value;
    const filtered=selectedRashi==='all'?rows:rows.filter(a=>a.rashi===selectedRashi);
    const sorted=filtered.sort((a,b)=>order.indexOf(a.rashi)-order.indexOf(b.rashi));
    grid.innerHTML=sorted.map(a=>`<article class="card"><div class="body"><span class="cat">राशिफल</span><h3>${esc(a.title||a.rashi)}</h3><p style="font-size:15px;line-height:1.7;min-height:0">${renderRashifal(a.content)}</p>${a.source_name?`<p style="font-size:11px;color:#777;min-height:0">स्रोत: ${esc(a.source_name)}</p>`:''}</div></article>`).join('')||'<div class="empty">इस तारीख का राशिफल उपलब्ध नहीं है।</div>';
  }catch(e){
    grid.innerHTML='<div class="empty">राशिफल लोड नहीं हो पाया। कृपया थोड़ी देर बाद फिर प्रयास करें।</div>';
  }
}

const names={'trending':'🔥 Trending News','news':'📰 Latest News','fact-check':'🛡️ Fact Check','explained':'💡 Explained','entertainment':'🎬 Entertainment','sports':'⚽ Sports','tech-education':'💻 Tech & Education','social':'📱 Social Media','rashifal':'🌙 Rashifal'};
document.getElementById('heading').textContent=names[wanted]||'📰 News';
function strip(v){const d=document.createElement('div');d.innerHTML=String(v||'');return d.textContent||''}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}\nfunction renderRashifal(v){
  const html=String(v||'');
  if(/<\/?(h[1-6]|p|strong|b|br|ul|ol|li)[^>]*>/i.test(html)) return html;
  const box=document.createElement('textarea');
  box.innerHTML=html;
  return esc(box.value).replace(/\\n/g,'<br>');
}
function norm(v){return String(v||'').toLowerCase().trim().replace(/[\s_-]+/g,' ')}
function homeCategory(a){
  const t=norm(a.title);
  if(t.includes('samay raina')||t.includes('समय रैना'))return 'entertainment';
  if(t.includes('awarapan 2')||t.includes('आवारापन 2')||t.includes('आवारापन-2'))return 'entertainment';
  if((t.includes('modi')||t.includes('मोदी')||t.includes('नरेंद्र मोदी')||t.includes('नरेन्द्र मोदी')) &&
     ['ai','skill','training','coaching','exam','युवा','करोड़','crore','education','शिक्षा','course'].some(k=>t.includes(norm(k))))return 'tech-education';
  if(t.includes('लड़की')||t.includes('लड़की')||t.includes('ladki')||t.includes('girl'))return 'social';
  const vals=[norm(a.category),norm(a.article_type),...(Array.isArray(a.categories)?a.categories.map(norm):[])];
  const has=words=>words.some(w=>vals.some(v=>v===norm(w)||v.includes(norm(w))));
  if(has(['entertainment','मनोरंजन','music']))return 'entertainment';
  if(has(['sports','sport','cricket','football','खेल']))return 'sports';
  if(has(['social media','social','instagram','youtube']))return 'social';
  if(has(['fact check','factcheck','fact']))return 'fact-check';
  if(has(['explained','explain']))return 'explained';
  if(has(['technology','tech','education','ai','exam','digital']))return 'tech-education';
  if(has(['news','viral news','india','राष्ट्रीय','भारत']))return 'news';
  return 'news';
}
const labels={'entertainment':'ENTERTAINMENT','sports':'SPORTS','social':'SOCIAL MEDIA','fact-check':'FACT CHECK','explained':'EXPLAINED','tech-education':'TECH & EDUCATION','news':'NEWS'};
function articleCard(a){const id=encodeURIComponent(a.id||'');const title=esc(a.title||'बड़ी खबर');const ex=esc(a.excerpt||a.summary||strip(a.content).slice(0,150)||'पूरी खबर पढ़ें');const mapped=homeCategory(a);const label=esc(labels[mapped]||a.category||a.article_type||'NEWS');const img=a.image_url?'<div class="img"><img src="'+esc(a.image_url)+'" alt="'+title+'"></div>':'';return '<article class="card" onclick="location.href=\'article.html?id='+id+'\'" role="link" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();location.href=\'article.html?id='+id+'\'}">'+img+'<div class="body"><span class="cat">'+label+'</span><h3>'+title+'</h3><p>'+ex+'</p><button class="read" onclick="event.stopPropagation();location.href=\'article.html?id='+id+'\'">पूरी खबर पढ़ें</button></div></article>'}
async function load(){
  if(isRashifal){await loadRashifal();return;}
  const grid=document.getElementById('grid');
  try{
    const r=await fetch(URL+'/rest/v1/articles?select=*&order=published_at.desc.nullslast,created_at.desc&limit=200',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});
    if(!r.ok)throw Error(r.status);
    const rows=await r.json();
    const all=(Array.isArray(rows)?rows:[]).filter(a=>{
      const status=String(a.status??'').trim().toLowerCase();
      if(status==='')return true;
      if(['published','publish','live','active'].includes(status))return true;
      if(a.is_published===true||a.published===true)return true;
      return false;
    });
    const safeAll=all.length||!rows.length?all:rows;
    let items=safeAll;
    const matches=(a,key)=>{
      const raw=[norm(a.category),norm(a.article_type),...(Array.isArray(a.categories)?a.categories.map(norm):[])];
      return homeCategory(a)===key || raw.some(v=>v===norm(key)||v.includes(norm(key)));
    };

    if(wanted==='trending'){
      // Trending: today's published articles only, ranked by views, maximum 4.
      const now=new Date();
      const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      items=safeAll
        .filter(a=>String(a.published_at||a.created_at||'').slice(0,10)===today)
        .sort((a,b)=>{
          const vd=(Number(b.views)||0)-(Number(a.views)||0);
          if(vd!==0)return vd;
          return String(b.published_at||b.created_at||'').localeCompare(String(a.published_at||a.created_at||''));
        })
        .slice(0,4);
    } else {
      items=safeAll.filter(a=>matches(a,wanted));
    }

    const pageSize=7;
    const totalPages=Math.max(1,Math.ceil(items.length/pageSize));
    let page=Math.max(1,parseInt(params.get('page')||'1',10)||1);
    if(page>totalPages)page=totalPages;
    const start=(page-1)*pageSize;
    const visible=items.slice(start,start+pageSize);

    grid.innerHTML=visible.map(articleCard).join('')||'<div class="empty">इस category में अभी कोई प्रकाशित खबर उपलब्ध नहीं है।</div>';
    renderPagination(totalPages,page);
  }catch(e){
    grid.innerHTML='<div class="empty">खबरें लोड नहीं हो पाईं। कृपया थोड़ी देर बाद फिर प्रयास करें।</div>';
    document.getElementById('pagination').innerHTML='';
    console.error(e);
  }
}
function renderPagination(total,current){
  const box=document.getElementById('pagination');
  if(!box)return;
  if(total<=1){box.innerHTML='';return;}
  const make=(p,label,cls='')=>`<a class="${cls}" href="category.html?category=${encodeURIComponent(wanted)}&page=${p}">${label}</a>`;
  let html='';
  if(current>1)html+=make(current-1,'‹ पिछला','next');
  const max=5;
  let from=Math.max(1,current-2),to=Math.min(total,from+max-1);
  if(to-from+1<max)from=Math.max(1,to-max+1);
  if(from>1)html+=make(1,'1');
  if(from>2)html+='<span>…</span>';
  for(let p=from;p<=to;p++)html+=p===current?`<span class="active">${p}</span>`:make(p,String(p));
  if(to<total-1)html+='<span>…</span>';
  if(to<total)html+=make(total,String(total));
  if(current<total)html+=make(current+1,'अगला ›','next');
  html+=`<div class="page-note" style="flex-basis:100%">पेज ${current} / ${total}</div>`;
  box.innerHTML=html;
}
load();
</script></body></html>
